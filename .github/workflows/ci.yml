name: CI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Java 25 / Maven verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Maven runs on the runner; Testcontainers starts LocalStack through Docker.
      - name: Check Docker
        run: docker info

      - name: Verify including S3 integration tests
        run: mvn --batch-mode --no-transfer-progress verify
