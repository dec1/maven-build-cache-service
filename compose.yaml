services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      - "5005:5005"

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"

volumes:
  maven-cache:
