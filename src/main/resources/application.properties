# Default to in-memory backend so the application and controller tests still run
# without Docker or AWS configuration. Use CACHE_STORAGE_TYPE=s3 to enable S3CacheStorage.
cache.storage.type=${CACHE_STORAGE_TYPE:memory}

# Required -only- when cache.storage.type=s3.
cache.storage.s3.bucket=${CACHE_STORAGE_S3_BUCKET:}
cache.storage.s3.region=${CACHE_STORAGE_S3_REGION:}

# LocalStack endpoint used when cache.storage.s3.backend=localstack.
# Set this to the address of the LocalStack instance used by the running application.
# Automated tests start their own LocalStack container and use its endpoint independently.
cache.storage.s3.localstack-endpoint=${CACHE_STORAGE_S3_LOCALSTACK_ENDPOINT:}