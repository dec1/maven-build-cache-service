# Default to in-memory backend so the application and controller tests still run
# without Docker or AWS configuration. Use CACHE_STORAGE_TYPE=s3 to enable S3CacheStorage.
cache.storage.type=${CACHE_STORAGE_TYPE:memory}

# Required when cache.storage.type=s3.
cache.storage.s3.bucket=${CACHE_STORAGE_S3_BUCKET:}
cache.storage.s3.region=${CACHE_STORAGE_S3_REGION:}

# Optional endpoint override. Set this for LocalStack; leave it unset for normal Amazon S3.
cache.storage.s3.endpoint=${CACHE_STORAGE_S3_ENDPOINT:}
